# XGBoost hyperparameters for the shared demand model (tune on VALIDATION only; never on test).
# Changing these changes results for everyone: log it in docs/decisions.md.
model:
  objective: reg:tweedie            # suits intermittent, non-negative count data (many zero-sales days)
  tweedie_variance_power: 1.1
  n_estimators: 1000                # upper bound; early stopping on the validation split picks the real number
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  tree_method: hist
  eval_metric: rmse
  early_stopping_rounds: 50
  random_state: 42
  n_jobs: -1
